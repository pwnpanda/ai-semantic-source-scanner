    target: express-ssrf-axios
    language: javascript
    engine: hybrid
    # Positive eval target for §7 broadened SSRF sink pattern: axios.get
    # with attacker-controlled URL.
    expected_findings:
      - id: EXPRESS-SSRF-AXIOS-001
        cwe: CWE-918
        file: server.js
        source_line: 9
        sink_line: 10
        source_contains: req.query
        sink_contains: get
        line_tolerance: 1
    # CWE-79 allow follows the express-ssrf precedent: Joern traces the
    # response body to res.send and emits a dataflow CWE-79 candidate.
    # This fixture is SSRF-focused; the XSS-shape candidate is acceptable
    # and stays visible under Invariant 1.
    allowed_false_positives:
      - cwe: CWE-352
        file: server.js
      - cwe: CWE-79
        file: server.js
  - id: express-ssrf-allowlist
    target: express-ssrf-allowlist
    language: javascript
    engine: hybrid
    # Negative eval target for §7: SSRF sink fires but ssrf.host-allowlist
