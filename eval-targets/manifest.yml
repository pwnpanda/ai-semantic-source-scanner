  - id: python-flask-ssrf-aliased
    target: python-flask-ssrf-aliased
    language: python
    engine: hybrid
    # Phase 3 positive eval target for the type-aware SSRF receiver
    # AST walk: http_client = httpx.Client(); http_client.get(url) must
    # be flagged as CWE-918 even though `http_client` is not a literal
    # module name in `pythonSsrfReceiver`. The pre-walk in
    # `joern_queries.sc` collects `http_client` from the constructor
    # assignment and accepts it as a valid SSRF receiver.
    expected_findings:
      - id: PYTHON-FLASK-SSRF-ALIASED-001
        cwe: CWE-918
        file: server.py
        source_line: 22
        sink_line: 22
        source_contains: request.args
        sink_contains: get
        line_tolerance: 1
    allowed_false_positives: []
  - id: python-flask-ssrf-custom-client
    target: python-flask-ssrf-custom-client
    language: python
    engine: hybrid
    # Phase 5 end-to-end proof: `apiv2_fetch` is registered as a CWE-918
    # sink via the joern_extensions manifest field below (Phase 5.1; was
    # a sidecar JSON shipped in the target dir before the cleanup). The
    # eval harness writes the entries into the repo cache before Joern
    # runs, so Joern picks up the extra sink at scan time and fires the
    # SSRF flow. Without it, this target would miss.
    expected_findings:
      - id: PYTHON-FLASK-SSRF-CUSTOM-CLIENT-001
        cwe: CWE-918
        file: server.py
        source_line: 23
        sink_line: 25
        source_contains: request.args
        sink_contains: apiv2_fetch
        line_tolerance: 2
    allowed_false_positives:
      - cwe: CWE-918
        file: server.py
        sink_contains: urlopen
    joern_extensions:
      - language: python
        cwe: CWE-918
        sink_class: ssrf
        pattern: "(?i)^(apiv2_fetch)$"
        proposal_id: eval-fixture-apiv2-fetch
        rationale: "Custom HTTP-client wrapper; demonstrates Phase 5 Joern model patching via manifest field (Phase 5.1)."
  - id: python-flask-ssrf-transitive
    target: python-flask-ssrf-transitive
    language: python
    engine: hybrid
    # Phase 4 positive eval target: transitive aliasing
    #   client = httpx.Client()
    #   api    = client
    #   api.get(url)
    # The typeFullName scan + fixed-point alias resolution in
    # `joern_queries.sc` must collect both `client` and `api` so the
    # SSRF sink fires.
    expected_findings:
      - id: PYTHON-FLASK-SSRF-TRANSITIVE-001
        cwe: CWE-918
        file: server.py
        source_line: 23
        sink_line: 23
        source_contains: request.args
        sink_contains: get
        line_tolerance: 1
    allowed_false_positives: []
  - id: python-flask-xss
    target: python-flask-xss
    language: python
    engine: hybrid
    # render_template_string(user_input) is BOTH reflected XSS (the rendered
    # output is unescaped) AND server-side template injection (the template
    # body itself is attacker-controlled — Jinja2 RCE on a stock Flask app).
    # Phase 18 added the CWE-1336 sink so both flows fire; the manifest now
    # pins both.
    expected_findings:
      - id: PYTHON-FLASK-XSS-001
        cwe: CWE-79
        file: server.py
        source_line: 7
        sink_line: 10
        source_contains: request.args
        sink_contains: render_template_string
        line_tolerance: 1
      - id: PYTHON-FLASK-SSTI-001
        cwe: CWE-1336
        file: server.py
        source_line: 7
        sink_line: 10
        source_contains: request.args
        sink_contains: render_template_string
        line_tolerance: 1
    allowed_false_positives: []
  - id: python-flask-authz-missing
    target: python-flask-authz-missing
    language: python
    engine: hybrid-miss
    # Flask handler with @app.route("/resource/<id>", methods=["DELETE"]) is a
    # privileged state-changing operation on a resource — miss-finder fires
    # BOLA (resource id without authz), BFLA (privileged route without authz),
    # and missing-authn (state-changing without authn). All three are
    # legitimate concerns; the prior manifest expected only BOLA + authn,
    # missing the BFLA expected entry.
    expected_findings:
      - id: PYTHON-FLASK-AUTHZ-BOLA-001
        cwe: CWE-639
        file: server.py
        source_line: 11
        sink_line: 11
        source_contains: "app.route"
        sink_contains: resource identifier
        line_tolerance: 0
      - id: PYTHON-FLASK-AUTHZ-BFLA-001
        cwe: CWE-862
        file: server.py
        source_line: 11
        sink_line: 11
        source_contains: "app.route"
        sink_contains: privileged
        line_tolerance: 0
      - id: PYTHON-FLASK-AUTHN-MISSING-001
        cwe: CWE-287
        file: server.py
        source_line: 11
        sink_line: 11
        source_contains: "app.route"
        sink_contains: state-changing
        line_tolerance: 0
    allowed_false_positives: []
