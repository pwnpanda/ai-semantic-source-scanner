  - id: java-spring-sqli-custom-jdbc
    target: java-spring-sqli-custom-jdbc
    language: java
    engine: hybrid
    # Phase 11: target with a custom JdbcTemplate wrapper. The wrapper's
    # `runSelect` method is the LLM-proposed CodeQL extension shape (no
    # stock CodeQL model). Joern still catches it via the stock `queryForObject`
    # pattern at the delegate call inside the wrapper, so this case is also
    # a coverage positive. Used as documentation for the CodeQL extension
    # flow; full end-to-end CodeQL verification needs `codeql` on PATH and
    # is gated on the user's local toolchain.
    #
    # Phase 14: cross-file flow — source in UserController.java, sink in
    # CustomJdbcWrapper.java. Uses the source_file / sink_file matcher fields
    # so this scores as a full match instead of a partial.
    expected_findings:
      - id: JAVA-SPRING-SQLI-CUSTOM-JDBC-001
        cwe: CWE-89
        file: CustomJdbcWrapper.java
        source_file: UserController.java
        source_line: 17
        sink_file: CustomJdbcWrapper.java
        sink_line: 18
        source_contains: id
        sink_contains: queryForObject
        line_tolerance: 2
    allowed_false_positives: []
