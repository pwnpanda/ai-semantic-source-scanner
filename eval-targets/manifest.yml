    # CWE-352 CSRF middleware is intentionally missing on this SSRF-focused
    # fixture (precedent: §10).
    # CWE-79 is allowed because the existing engine emitted a co-location
    # XSS finding via `res.send(response body)`. After §8 (co-location
    # tagged + downscored) and §1 (no size gate), the co-location candidate
    # is visible but should score low; allowing it here keeps eval focused
    # on SSRF without re-litigating the broader XSS sink question.
    allowed_false_positives:
      - cwe: CWE-352
        file: server.js
      - cwe: CWE-79
        file: server.js
