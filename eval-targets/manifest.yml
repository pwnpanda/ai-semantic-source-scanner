  - id: go-net-ssrf
    target: go-net-ssrf
    language: go
    engine: hybrid
    # Built-in Go SSRF sinks deliberately omit bare `Get` (over-matches
    # map.Get etc.). This target's `http.Get` is added via the Phase 5
    # joern_extensions mechanism — proves Joern model patching works for
    # Go as well as Python.
    expected_findings:
      - id: GO-NET-SSRF-001
        cwe: CWE-918
        file: main.go
        source_line: 15
        sink_line: 16
        source_contains: r.URL.Query
        sink_contains: Get
        line_tolerance: 2
    allowed_false_positives: []
    joern_extensions:
      - language: go
        cwe: CWE-918
        sink_class: ssrf
        pattern: "(?i)\\bGet$"
        receiver_regex: "(?i)\\bhttp\\.Get\\b"
        proposal_id: eval-fixture-go-http-get
        rationale: "Go net/http.Get is the canonical SSRF sink; bare `Get` is over-broad without the http. receiver filter."
  - id: php-mysqli-sqli
    target: php-mysqli-sqli
    language: php
    engine: hybrid
    # Phase 12: PHP coverage via Joern's php2cpg frontend. php2cpg shells
