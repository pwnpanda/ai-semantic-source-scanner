# Pre-commit hooks for ai-codescan.
#
# Run via ``prek run`` (or ``pre-commit run``); install with ``prek install``
# so each commit triggers them automatically. There is no CI — the project
# is developed, tested, and run locally, so these hooks are the quality gate.
#
# Slow tests are deliberately left out of the commit hook. Run the full
# suite manually with ``uv run pytest -q`` before merging significant work;
# the local quick-check is ``uv run pytest tests/ -m "not integration"``.

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check
        args: [--force-exclude]
        types: [python]
        # Ruff's project configuration excludes generated protobuf and
        # deliberately vulnerable eval fixtures. Honor it for explicit paths.
        exclude: ^ai_codescan/third_party/
        require_serial: false

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        args: [--force-exclude]
        types: [python]
        exclude: ^ai_codescan/third_party/
        require_serial: false

      - id: ty-check
        name: ty check
        language: system
        entry: uv run ty check --error-on-warning ai_codescan/
        # ``ty check`` resolves the whole project; running it per-file is
        # slower than running it once on the package root.
        pass_filenames: false
        files: \.py$
        require_serial: true
